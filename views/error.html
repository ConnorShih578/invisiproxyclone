<!doctype html>
<html>
  <head>
    <base href="/" />
    <title>This site can’t be reached</title>
    <meta itemprop="http-status" content="404" />
    {{ifSEO}}{{
    <meta
      name="description"
      content="InvisiProxy is a secure web proxy service with support for many sites. Bypass filters and freely enjoy a safer private browsing experience or unblock websites on devices such as Chromebooks and at places like school or work without downloading anything."
    />
    }}
    <!--HEAD-CONTENT-->
    {{inline}}{{
    <script src="{{route}}{{assets/js/csel.js}}{{inline}}" defer></script>
    }}
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #202124;
        color: #9aa0a6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      #background,
      #footer {
        display: none;
      }

      #mainbody {
        max-width: 600px;
        margin: 12vh auto 0;
        padding: 0 24px;
      }

      .chrome-err-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 24px;
        color: #9aa0a6;
      }

      h1 {
        color: #e8eaed;
        font-size: 24px;
        font-weight: 500;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 12px;
        color: #9aa0a6;
      }

      .chrome-err-code {
        font-size: 12px;
        color: #9aa0a6;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 20px 0 28px;
      }

      .chrome-reload-btn {
        background-color: #8ab4f8;
        color: #202124;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }

      .chrome-reload-btn:hover {
        background-color: #aecbfa;
      }
    </style>
  </head>

  <body>
    <!-- IMPORTANT-IVINSERT-DONOTDELETE -->
    <!--ANTI-EXFIL-->
    <div id="background" class="fullwidth"></div>
    <!-- IMPORTANT-IVINSERT-DONOTDELETE -->
    <div id="mainbody" class="fullwidth">
      <div class="box-error">
        <svg
          class="chrome-err-icon"
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M10 6h20l8 8v28a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
          <polyline points="28 6 28 14 36 14" />
          <line x1="18" y1="24" x2="22" y2="28" />
          <line x1="22" y1="24" x2="18" y2="28" />
          <line x1="26" y1="24" x2="30" y2="28" />
          <line x1="30" y1="24" x2="26" y2="28" />
          <path d="M18 36c2-2 10-2 12 0" />
        </svg>
        <h1>This page isn’t working</h1>
        <p>The requested URL could not be retrieved or the connection was interrupted.</p>
        <div class="chrome-err-code">HTTP ERROR 404</div>
        <button class="chrome-reload-btn" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <div id="footer" class="fullwidth">
      <!--FOOTER-->
    </div>
    <!-- IMPORTANT-IVINSERT-DONOTDELETE -->
  </body>
</html>
